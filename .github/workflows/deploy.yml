name: Deploy Vite Site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Grants permissions required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allows only one concurrent deployment at a time
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout repository without submodule checks
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false

      # Step 2: Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Install dependencies cleanly
      - name: Install Dependencies
        run: npm ci

      # Step 4: Run Vite build command (outputs to docs/)
      - name: Build Project
        run: npm run build

      # Step 5: Configure GitHub Pages runner
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Step 6: Upload the docs directory as the deployment artifact
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      # Step 7: Deploy the artifact to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4